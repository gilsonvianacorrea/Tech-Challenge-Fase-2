[tool.poetry]
name = "tech-challenge-fase2"
version = "0.1.0"
description = "Pipeline MLOps para propensão de compra em e-commerce"
authors = ["Gilson Viana Corrêa e Marco Antônio de Souza <gilsonvianacorrea@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pandas = "^2.2.2"
numpy = "^2.0.0"
scikit-learn = "^1.5.0"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

