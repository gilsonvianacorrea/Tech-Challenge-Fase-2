stages:
  preprocess:
    cmd: poetry run python src/data.py
    deps:
      - data/raw/online_shoppers_intention.csv
      - src/data.py
    params:
      - data_split.test_size
      - data_split.random_state
    outs:
      - data/processed/

  train:
    cmd: poetry run python src/train.py
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
    params:
      - data_split.random_state
    outs:
      - models/model.joblib

  evaluate:
    cmd: poetry run python src/evaluate.py
    deps:
      - models/model.joblib
      - data/processed/test.csv
      - src/evaluate.py
    metrics:
      - metrics/scores.json:
          cache: false

  plots:
    cmd: poetry run python src/plots.py
    deps:
      - models/model.joblib
      - data/processed/test.csv
      - src/plots.py
    outs:
      - reports/figures/